# pi + Azure AI Foundry, keyless.
#
#   docker compose run --rm pi              # start pi in the current directory*
#   docker compose run --rm pi doctor       # check everything
#   docker compose run --rm pi login        # device-code sign-in (if no host az login)
#
# * From another project directory:
#   docker compose -f ~/pi-foundry-ai-service-container/compose.yaml run --rm pi
#   (tip: alias it, see README)
#
# Settings come from .env next to this file (copy .env.example).

name: pi-foundry

services:
  pi:
    build:
      context: .
      args:
        PI_VERSION: ${PI_VERSION:-latest}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    image: ${PI_FOUNDRY_IMAGE:-pi-foundry:local}
    stdin_open: true
    tty: true
    # Mount the project at the same absolute path as on the host, so pi keeps
    # separate sessions per project and paths in output match your machine.
    working_dir: ${PI_WORKSPACE:-${PWD}}
    volumes:
      - ${PI_WORKSPACE:-${PWD}}:${PI_WORKSPACE:-${PWD}}
      # Your pi config: settings.json, AGENTS.md, foundry.json, extensions/,
      # skills/, prompts/, themes/, sessions. Customize pi here.
      - ${PI_CONFIG_DIR:-~/.pi-foundry/agent}:/home/pi/.pi/agent
      # Host az login, copied read-only at startup (never modified).
      - ${AZURE_CONFIG_HOST_DIR:-~/.azure}:/host-azure:ro
      # Container-only sign-in (device code) and caches.
      - azure:/home/pi/.azure
      - cache:/home/pi/.cache
    environment:
      # Foundry
      FOUNDRY_RESOURCE: ${FOUNDRY_RESOURCE:-}
      FOUNDRY_RESOURCE_GROUP: ${FOUNDRY_RESOURCE_GROUP:-}
      FOUNDRY_ENDPOINT: ${FOUNDRY_ENDPOINT:-}
      FOUNDRY_DEFAULT_MODEL: ${FOUNDRY_DEFAULT_MODEL:-}
      FOUNDRY_EXCLUDE: ${FOUNDRY_EXCLUDE:-}
      FOUNDRY_DISCOVER: ${FOUNDRY_DISCOVER:-}
      FOUNDRY_INCLUDE_OTHER_MODELS: ${FOUNDRY_INCLUDE_OTHER_MODELS:-}
      FOUNDRY_SCOPE: ${FOUNDRY_SCOPE:-}
      FOUNDRY_AUTH: ${FOUNDRY_AUTH:-auto}
      FOUNDRY_QUIET: ${FOUNDRY_QUIET:-0}
      FOUNDRY_THEME: ${FOUNDRY_THEME:-}
      FOUNDRY_MODE: ${FOUNDRY_MODE:-ask}
      FOUNDRY_PERMISSIONS: ${FOUNDRY_PERMISSIONS:-on}
      # Azure identity
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      # Network
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
      # Container user (auto-detected from the workspace owner when empty)
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
      # Git identity for commits made by the agent
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      # Terminal
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}

volumes:
  azure:
  cache:
