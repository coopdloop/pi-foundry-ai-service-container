# pi + Azure AI Foundry, keyless.
#
# Use the launcher, which works from any project directory on macOS, Linux,
# WSL and Windows:
#   ./pi-foundry               (macOS / Linux / WSL / Git Bash)
#   .\pi-foundry.cmd           (Windows PowerShell / cmd)
#
# Plain compose also works from this directory:
#   PI_WORKSPACE=/path/to/project docker compose run --rm pi
#
# Settings come from .env next to this file (copy .env.example).

name: pi-foundry

services:
  pi:
    build:
      context: .
      args:
        PI_VERSION: ${PI_VERSION:-latest}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    image: ${PI_FOUNDRY_IMAGE:-pi-foundry:local}
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      # Your project. The launcher sets PI_WORKSPACE to the directory you run it from.
      - type: bind
        source: ${PI_WORKSPACE:-.}
        target: /workspace
      # Your pi config: settings.json, AGENTS.md, foundry.json, keybindings.json,
      # extensions/, skills/, prompts/, themes/, sessions. Customize pi here.
      - ${PI_CONFIG_DIR:-~/.pi-foundry/agent}:/home/pi/.pi/agent
      # Host az login, copied read-only at startup (never modified).
      - ${AZURE_CONFIG_HOST_DIR:-~/.azure}:/host-azure:ro
      # Host Docker. The agent can build and run containers on your machine.
      - type: bind
        source: ${DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
      # Git identity (name, email, aliases). Copied at startup; host-only
      # settings like credential helpers are dropped. Never modified.
      - type: bind
        source: ${GIT_CONFIG_HOST:-~/.gitconfig}
        target: /host-gitconfig
        read_only: true
        bind:
          create_host_path: false
      # Container-only sign-in (device code) and tool caches (pip, uv, npm, pnpm).
      - azure:/home/pi/.azure
      - cache:/home/pi/.cache
    environment:
      # Where the project lives on your machine (for sessions and docker -v)
      HOST_WORKSPACE: ${PI_WORKSPACE:-}
      HOST_OS: ${HOST_OS:-}
      # Foundry
      FOUNDRY_RESOURCE: ${FOUNDRY_RESOURCE:-}
      FOUNDRY_RESOURCE_GROUP: ${FOUNDRY_RESOURCE_GROUP:-}
      FOUNDRY_ENDPOINT: ${FOUNDRY_ENDPOINT:-}
      FOUNDRY_DEFAULT_MODEL: ${FOUNDRY_DEFAULT_MODEL:-}
      FOUNDRY_EXCLUDE: ${FOUNDRY_EXCLUDE:-}
      FOUNDRY_DISCOVER: ${FOUNDRY_DISCOVER:-}
      FOUNDRY_INCLUDE_OTHER_MODELS: ${FOUNDRY_INCLUDE_OTHER_MODELS:-}
      FOUNDRY_SCOPE: ${FOUNDRY_SCOPE:-}
      FOUNDRY_AUTH: ${FOUNDRY_AUTH:-auto}
      FOUNDRY_QUIET: ${FOUNDRY_QUIET:-0}
      FOUNDRY_THEME: ${FOUNDRY_THEME:-}
      FOUNDRY_MODE: ${FOUNDRY_MODE:-ask}
      FOUNDRY_PERMISSIONS: ${FOUNDRY_PERMISSIONS:-on}
      # Azure identity
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      # Network
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
      # Container user (auto-detected from the workspace owner when empty)
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
      # Git identity overrides (take precedence over the mounted .gitconfig)
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      # Terminal
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}

volumes:
  azure:
  cache:
